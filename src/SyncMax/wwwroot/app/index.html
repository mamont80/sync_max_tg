<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover — иначе нижнее меню уезжает под системную полосу на iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>SyncMax</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!--
      Мост Telegram подключается синхронно — в Telegram-клиенте он отдаётся мгновенно.
      Мост MAX (https://st.max.ru/js/max-web-app.js) догружается уже из platform.js и
      только если телеграмовского initData не оказалось: иначе в Telegram пришлось бы
      ждать запрос к чужому CDN на каждом запуске.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header class="topbar">
        <h1 class="topbar__title" id="screen-title">Связки</h1>
        <p class="topbar__subtitle" id="screen-subtitle"></p>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="tabbar" id="tabbar" aria-label="Разделы">
      <div class="tabbar__inner">
        <button class="tab" type="button" data-tab="links" aria-current="page">
            <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 14.5 14.5 9.5" />
                <path d="M11 6.5 12.8 4.7a4 4 0 0 1 5.7 5.7L16.6 12.3" />
                <path d="M13 17.5 11.2 19.3a4 4 0 0 1-5.7-5.7L7.4 11.7" />
            </svg>
            <span class="tab__label">Связки</span>
        </button>
        <button class="tab" type="button" data-tab="subscription">
            <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3.8 14.4 8.7l5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8Z" />
            </svg>
            <span class="tab__label">Подписка</span>
        </button>
        <button class="tab" type="button" data-tab="stats">
            <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 19V11" />
                <path d="M12 19V5" />
                <path d="M19 19v-5" />
            </svg>
            <span class="tab__label">Статистика</span>
        </button>
        <button class="tab" type="button" data-tab="support">
            <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 0-3.2 6.4L20 20l-1.1-3.3A8 8 0 0 0 20 12Z" />
                <path d="M9.8 9.6a2.3 2.3 0 1 1 3 2.2v1.3" />
                <path d="M12.8 16.1h0" />
            </svg>
            <span class="tab__label">Поддержка</span>
        </button>
      </div>
    </nav>

    <!-- Лист (bottom sheet) для экранов «вглубь»: карточка связки, инструкция. -->
    <div class="sheet" id="sheet" hidden>
        <div class="sheet__backdrop" data-sheet-close></div>
        <section class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet__grabber"></div>
            <h2 class="sheet__title" id="sheet-title"></h2>
            <div class="sheet__body" id="sheet-body"></div>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
